# Reverse proxy cùng origin: frontend (Vite) và API (Laravel) dùng chung một domain/cổng,
# nhờ đó Sanctum SPA xác thực bằng session cookie không cần cấu hình CORS.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 32m;
    error_page 413 = @upload_too_large;
    server_tokens off;

    location @upload_too_large {
        default_type application/json;
        return 413 '{"message":"Yêu cầu tải lên quá lớn. Vui lòng gửi tối đa 20 ảnh, tổng 30 MB mỗi lần."}';
    }

    # Laravel: REST API, cookie CSRF của Sanctum và health check của framework
    location ~ ^/(api|sanctum|up)(/|$) {
        fastcgi_pass app:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_param HTTP_PROXY "";
        fastcgi_read_timeout 60s;
    }

    # React SPA (Vite dev server, hỗ trợ WebSocket cho HMR)
    location / {
        proxy_pass http://frontend:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
