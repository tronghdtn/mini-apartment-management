; Cấu hình PHP cho môi trường phát triển
; Laravel ghi đè bằng APP_TIMEZONE (UTC); giữ đồng bộ cho script PHP thuần
date.timezone = UTC
memory_limit = 256M
upload_max_filesize = 20M
; Ngân sách ứng dụng: 20 ảnh / 30 MiB; dành chỗ cho multipart và văn bản.
post_max_size = 32M
; Phân tích đủ tệp trước validation; tránh PHP âm thầm bỏ tệp thứ 21.
max_file_uploads = 64
expose_php = Off

; PHP advisory 23/10/2026: cấu hình trước khi phân tích request (không dùng ini_set).
; Laravel dùng session database; không dùng tiến độ upload của PHP native session.
session.upload_progress.enabled = Off

; Bind mount: vẫn kiểm tra file thay đổi, nhưng tối đa 2 giây/lần thay vì mỗi request.
; PAY504: mỗi request nạp ~543 file; stat trên bind mount Windows ~1,3 giây/lượt (container fs ~1,5 ms),
; revalidate_freq = 0 làm request chậm 1–15 giây và xếp hàng ở 5 worker FPM (đo §12.67 IMPLEMENTATION_PLAN).
; Deploy thật nên dùng validate_timestamps = 0 kèm php artisan optimize.
opcache.enable = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
