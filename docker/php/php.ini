; Cấu hình PHP cho môi trường phát triển
date.timezone = Asia/Ho_Chi_Minh
memory_limit = 256M
upload_max_filesize = 20M
post_max_size = 20M
expose_php = Off

; Bind mount: luôn kiểm tra file thay đổi để code mới có hiệu lực ngay
opcache.enable = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
