; Cấu hình PHP cho môi trường phát triển
; Laravel ghi đè bằng APP_TIMEZONE (UTC); giữ đồng bộ cho script PHP thuần
date.timezone = UTC
memory_limit = 256M
upload_max_filesize = 20M
; Ngân sách ứng dụng: 20 ảnh / 30 MiB; dành chỗ cho multipart và văn bản.
post_max_size = 32M
; Phân tích đủ tệp trước validation; tránh PHP âm thầm bỏ tệp thứ 21.
max_file_uploads = 64
expose_php = Off

; PHP advisory 23/10/2026: cấu hình trước khi phân tích request (không dùng ini_set).
; Laravel dùng session database; không dùng tiến độ upload của PHP native session.
session.upload_progress.enabled = Off

; Bind mount: luôn kiểm tra file thay đổi để code mới có hiệu lực ngay
opcache.enable = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
