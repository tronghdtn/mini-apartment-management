name: ${COMPOSE_PROJECT_NAME:-mini-apartment}

services:
  nginx:
    image: nginx:1.28-alpine
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
      - frontend
    networks:
      - app-network
    restart: unless-stopped

  app:
    build:
      context: ./docker/php
    volumes:
      - ./backend:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/zz-app.ini:ro
    environment:
      APP_URL: http://localhost:${APP_PORT:-8080}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-mini_apartment}
      DB_USERNAME: ${DB_USERNAME:-mini_apartment}
      DB_PASSWORD: ${DB_PASSWORD:?Chưa đặt DB_PASSWORD trong .env}
      DB_TEST_PASSWORD: ${DB_TEST_PASSWORD:?Chưa đặt DB_TEST_PASSWORD trong .env — chạy scripts/setup.sh}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-false}
      # DB-D95: thư tài khoản (quên mật khẩu, xác minh/đổi email) đi vào hộp thư Mailpit nội bộ, không ra Internet.
      MAIL_MAILER: ${MAIL_MAILER:-smtp}
      MAIL_HOST: ${MAIL_HOST:-mailpit}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-no-reply@miniapart.test}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-MiniApart}
    depends_on:
      mysql:
        condition: service_healthy
      mailpit:
        condition: service_started
    networks:
      - app-network
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-mini_apartment}
      MYSQL_USER: ${DB_USERNAME:-mini_apartment}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Chưa đặt DB_PASSWORD trong .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Chưa đặt DB_ROOT_PASSWORD trong .env}
      # Dùng bởi docker/mysql/init để tạo tài khoản test riêng
      MYSQL_TEST_PASSWORD: ${DB_TEST_PASSWORD:?Chưa đặt DB_TEST_PASSWORD trong .env — chạy scripts/setup.sh}
    ports:
      # Chỉ mở trên localhost để dùng công cụ quản trị DB / chạy artisan từ máy host
      - "127.0.0.1:${DB_FORWARD_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # Script khởi tạo (chỉ chạy khi volume mới): tạo database + tài khoản test riêng
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - app-network
    restart: unless-stopped

  mailpit:
    # Hộp thư giả lập cho dev/demo: xem thư tại http://localhost:8025 (chỉ mở trên localhost).
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
    networks:
      - app-network
    restart: unless-stopped

  frontend:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm install --no-audit --no-fund && npm run dev"
    volumes:
      - ./frontend:/app
      # node_modules riêng cho Linux, không dùng bản cài trên Windows/macOS
      - frontend_node_modules:/app/node_modules
    environment:
      VITE_USE_POLLING: "true"
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:

volumes:
  mysql_data:
  frontend_node_modules:
